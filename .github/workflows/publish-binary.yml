name: Publish binary repo

# Publishes the Rust .crate + Java Maven JAR into the `binary` branch of this
# repository (a local GitHub-hosted binary / Maven repo).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-binary
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_BRANCH: binary

jobs:
  publish:
    name: build + publish to binary branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('source/java/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build crate + JAR + bundle
        id: bundle
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/package-bundle.sh
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="mcdx_ql") | .version')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare binary branch worktree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf binary-repo
          if git ls-remote --exit-code --heads "${REMOTE}" "${BINARY_BRANCH}" >/dev/null; then
            git clone --branch "${BINARY_BRANCH}" --single-branch --depth 1 \
              "${REMOTE}" binary-repo
          else
            mkdir -p binary-repo
            git -C binary-repo init
            git -C binary-repo checkout -b "${BINARY_BRANCH}"
            printf '%s\n' '.DS_Store' > binary-repo/.gitignore
            git -C binary-repo add .gitignore
            git -C binary-repo \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Initialize binary branch"
            git -C binary-repo remote add origin "${REMOTE}"
            git -C binary-repo push -u origin "${BINARY_BRANCH}"
          fi

      - name: Stage artifacts into binary repo
        run: |
          set -euo pipefail
          chmod +x source/scripts/*.sh
          ./source/scripts/publish-binary-repo.sh "${GITHUB_WORKSPACE}/binary-repo"

      - name: Commit and push binary branch
        working-directory: binary-repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bundle.outputs.version }}
          SHA: ${{ steps.bundle.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add -A
          if git diff --cached --quiet; then
            echo "No binary-repo changes for ${VERSION}; nothing to publish."
            exit 0
          fi

          git commit -m "Publish mcdx_ql ${VERSION} (${SHA})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BINARY_BRANCH}"; then
              exit 0
            fi
            echo "push failed (attempt ${attempt}); rebasing..."
            git pull --rebase origin "${BINARY_BRANCH}" || true
            sleep $((attempt * 4))
          done
          echo "failed to push binary branch" >&2
          exit 1

      - name: Summary
        run: |
          VERSION="${{ steps.bundle.outputs.version }}"
          {
            echo "## Binary repo published"
            echo ""
            echo "- Branch: [\`${BINARY_BRANCH}\`](${{ github.server_url }}/${{ github.repository }}/tree/${BINARY_BRANCH})"
            echo "- Version: \`${VERSION}\`"
            echo "- Maven: \`https://raw.githubusercontent.com/${{ github.repository }}/${BINARY_BRANCH}/maven\`"
            echo "- Crate: \`https://raw.githubusercontent.com/${{ github.repository }}/${BINARY_BRANCH}/crates/mcdx_ql-${VERSION}.crate\`"
            echo "- Javadoc: [\`javadoc/latest/\`](${{ github.server_url }}/${{ github.repository }}/tree/${BINARY_BRANCH}/javadoc/latest)"
            echo "- Bundle: \`https://raw.githubusercontent.com/${{ github.repository }}/${BINARY_BRANCH}/bundles/mcdx_ql-${VERSION}-bundle.tar.gz\`"
          } >> "$GITHUB_STEP_SUMMARY"
