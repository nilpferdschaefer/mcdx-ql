name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build release bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      tag: ${{ steps.bundle.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        id: bundle
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="mcdx_ql") | .version')"
          EXPECTED="v${VERSION}"
          if [[ "${TAG}" != "${EXPECTED}" ]]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${EXPECTED}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          cargo test
          cargo package --no-verify
          cargo doc --no-deps --document-private-items

          DEST="dist/mcdx_ql-${VERSION}"
          mkdir -p "${DEST}/docs"
          cp "target/package/mcdx_ql-${VERSION}.crate" "${DEST}/"
          cp -a target/doc/. "${DEST}/docs/"
          cat > "${DEST}/USAGE.txt" <<EOF
          mcdx_ql ${VERSION}

          Prefer git dependency from sibling repos:

            mcdx_ql = { git = "https://github.com/nilpferdschaefer/mcdx-ql", tag = "${TAG}" }

          Or unpack this bundle and path-depend:

            tar xzf mcdx_ql-${VERSION}-bundle.tar.gz
            # Cargo.toml: mcdx_ql = { path = "…/vendor/mcdx_ql-${VERSION}" }
            # after: cargo unpack mcdx_ql-${VERSION}.crate

          Docs: open docs/mcdx_ql/index.html (or https://nilpferdschaefer.github.io/mcdx-ql/ when Pages is enabled)
          EOF

          tar -C dist -czf "dist/mcdx_ql-${VERSION}-bundle.tar.gz" "mcdx_ql-${VERSION}"
          # Pages artifact: just the doc tree rooted so / → crate docs
          mkdir -p _site
          cp -a target/doc/. _site/
          # GitHub Pages root redirect
          cat > _site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=mcdx_ql/index.html">
            <title>mcdx_ql docs</title>
            <link rel="canonical" href="mcdx_ql/index.html">
          </head>
          <body><p><a href="mcdx_ql/index.html">mcdx_ql documentation</a></p></body>
          </html>
          HTML

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcdx_ql-${{ steps.bundle.outputs.version }}-bundle
          path: |
            dist/mcdx_ql-${{ steps.bundle.outputs.version }}-bundle.tar.gz
            dist/mcdx_ql-${{ steps.bundle.outputs.version }}/mcdx_ql-${{ steps.bundle.outputs.version }}.crate
          if-no-files-found: error
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bundle.outputs.tag }}
          name: mcdx_ql ${{ steps.bundle.outputs.version }}
          generate_release_notes: true
          files: |
            dist/mcdx_ql-${{ steps.bundle.outputs.version }}-bundle.tar.gz
            dist/mcdx_ql-${{ steps.bundle.outputs.version }}/mcdx_ql-${{ steps.bundle.outputs.version }}.crate
          body: |
            ## Consume from another `nilpferdschaefer` repo

            ```toml
            [dependencies]
            mcdx_ql = { git = "https://github.com/nilpferdschaefer/mcdx-ql", tag = "${{ steps.bundle.outputs.tag }}" }
            ```

            Private git deps need a token/SSH key with repo read access (standard for private crates).

            **Artifacts**
            - `mcdx_ql-*-bundle.tar.gz` — `.crate` + rustdoc HTML (`docs/mcdx_ql/index.html`)
            - `mcdx_ql-*.crate` — cargo package alone

  deploy-docs:
    name: deploy rustdoc to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
