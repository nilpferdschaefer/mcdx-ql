name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build release bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      tag: ${{ steps.bundle.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java (GitHub Packages settings.xml)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ github.workspace }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('java/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Verify tag + build bundle
        id: bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="mcdx_ql") | .version')"
          EXPECTED="v${VERSION}"
          if [[ "${TAG}" != "${EXPECTED}" ]]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${EXPECTED}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          cargo test
          cargo test --features jni
          chmod +x scripts/*.sh
          ./scripts/package-bundle.sh
          ./scripts/ci-publish-maven.sh

          mkdir -p _site/javadoc
          cp -a target/doc/. _site/
          JAVADOC_HTML="java/target/reports/apidocs"
          if [[ ! -f "${JAVADOC_HTML}/index.html" && -f java/target/apidocs/index.html ]]; then
            JAVADOC_HTML="java/target/apidocs"
          fi
          cp -a "${JAVADOC_HTML}/." _site/javadoc/
          cat > _site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>mcdx_ql docs</title>
          </head>
          <body>
            <h1>mcdx-ql documentation</h1>
            <ul>
              <li><a href="mcdx_ql/index.html">Rust (rustdoc)</a></li>
              <li><a href="javadoc/index.html">Java (Javadoc)</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcdx_ql-${{ steps.bundle.outputs.version }}-bundle
          path: |
            dist/mcdx_ql-${{ steps.bundle.outputs.version }}-bundle.tar.gz
            java/target/mcdx-ql-${{ steps.bundle.outputs.version }}.jar
            java/target/mcdx-ql-${{ steps.bundle.outputs.version }}-javadoc.jar
          if-no-files-found: error
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bundle.outputs.tag }}
          name: mcdx_ql ${{ steps.bundle.outputs.version }}
          generate_release_notes: true
          files: |
            dist/mcdx_ql-${{ steps.bundle.outputs.version }}-bundle.tar.gz
            java/target/mcdx-ql-${{ steps.bundle.outputs.version }}.jar
            java/target/mcdx-ql-${{ steps.bundle.outputs.version }}-javadoc.jar
          body: |
            ## Rust

            ```toml
            [dependencies]
            mcdx_ql = { git = "https://github.com/nilpferdschaefer/mcdx-ql", tag = "${{ steps.bundle.outputs.tag }}" }
            ```

            ## Java

            Download `mcdx-ql-*.jar` (JNI native lib embedded for linux-x86_64 from CI) or unpack the bundle:

            ```java
            String json = com.nilpferdschaefer.mcdxql.McdxQl.compile("""
              {"expr":"AVG([close.1d], 14)","assets":["BTC"],"params":{"period":14}}
              """);
            ```

            **Artifacts**
            - `mcdx_ql-*-bundle.tar.gz` — `.crate` + rustdoc + JAR + javadoc + natives
            - `mcdx-ql-*.jar` — Java bindings alone
            - `mcdx-ql-*-javadoc.jar` — Javadoc JAR
            - Docs: https://nilpferdschaefer.github.io/mcdx-ql/ (rustdoc + `/javadoc/`)

  deploy-docs:
    name: deploy rustdoc to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
